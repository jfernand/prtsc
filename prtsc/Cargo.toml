[package]
name = "prtsc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Screen capture CLI (and MCP server) driven by the XDG Desktop Portal's screenshot picker"

[[bin]]
name = "prtsc"
path = "src/bin/prtsc.rs"

[dependencies]
ashpd = { version = "0.13.13", features = ["screenshot", "screencast"] }
tokio = { version = "1", features = ["rt", "net", "time", "io-std"] }
rmcp = { version = "0.13", features = ["server", "macros", "transport-io"] }
serde_json = "1.0.151"
